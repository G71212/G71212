name: Check faster results (football-data.org)

# Manual check that the FOOTBALL_DATA_API_KEY secret works and that football-data.org's
# final scores line up with football-data.co.uk's results for the same matches.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past days to compare (1-30)"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: football-predictor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football-predictor/pyproject.toml

      - name: Install
        run: pip install .

      - name: Restore downloaded data
        uses: actions/cache/restore@v4
        with:
          path: football-predictor/.cache
          key: football-data-check-${{ github.run_id }}
          restore-keys: football-data-

      - name: Compare the two results sources
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DAYS: ${{ inputs.days }}
        run: |
          set -o pipefail
          footy livecheck --days "${DAYS:-10}" | tee check.txt
          { echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
