[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footy-predictor"
version = "1.0.0"
description = "Daily football predictions for BTTS & Over 2.5, Over 2.5, BTTS and Double Chance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
footy = "footy_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
footy_predictor = ["templates/*.html", "templates/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
